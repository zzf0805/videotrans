name: Build Windows

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $redist = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $installations = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath
            foreach ($installation in $installations) {
              $redistRoot = Join-Path $installation "VC\Redist\MSVC"
              if (Test-Path $redistRoot) {
                $redist = Get-ChildItem $redistRoot -Directory |
                  Sort-Object Name -Descending |
                  ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
                if ($redist) { break }
              }
            }
          }
          if (-not $redist) {
            $searchRoots = @(
              "${env:ProgramFiles}\Microsoft Visual Studio",
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
            ) | Where-Object { Test-Path $_ }
            $redist = $searchRoots |
              ForEach-Object { Get-ChildItem $_ -Recurse -Directory -Filter "Microsoft.VC143.CRT" -ErrorAction SilentlyContinue } |
              Where-Object { $_.FullName -like "*\x64\Microsoft.VC143.CRT" } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $redist) {
            throw "Visual C++ runtime directory not found"
          }
          Copy-Item "$redist\*.dll" "build/windows/x64/runner/Release" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videotrans-windows-x64
          path: build/windows/x64/runner/Release/*
          retention-days: 30
