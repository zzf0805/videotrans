name: Build Windows

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $redist = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $redist) {
            throw "Visual C++ runtime directory not found"
          }
          Copy-Item "$($redist.FullName)\*.dll" "build/windows/x64/runner/Release" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videotrans-windows-x64
          path: build/windows/x64/runner/Release/*
          retention-days: 30
